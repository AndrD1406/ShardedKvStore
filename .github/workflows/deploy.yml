name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      coordinator_image: ${{ steps.names.outputs.coordinator }}
      shard_image: ${{ steps.names.outputs.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & build
        run: |
          dotnet restore ShardedKvStore.sln
          dotnet build ShardedKvStore.sln -c Release --no-restore

      - name: Consistent-hashing migration benchmark
        run: dotnet run --project tests/ShardingBenchmark -c Release --no-build

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "coordinator=${REGISTRY}/${owner}/shardedkv-coordinator" >> "$GITHUB_OUTPUT"
          echo "shard=${REGISTRY}/${owner}/shardedkv-shard" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push coordinator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Coordinator/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.coordinator }}:latest
            ${{ steps.names.outputs.coordinator }}:${{ github.sha }}
          cache-from: type=gha,scope=coordinator
          cache-to: type=gha,mode=max,scope=coordinator

      - name: Build & push shard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Shard/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.shard }}:latest
            ${{ steps.names.outputs.shard }}:${{ github.sha }}
          cache-from: type=gha,scope=shard
          cache-to: type=gha,mode=max,scope=shard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      COORDINATOR_IMAGE: ${{ needs.build.outputs.coordinator_image }}:${{ github.sha }}
      SHARD_IMAGE: ${{ needs.build.outputs.shard_image }}:${{ github.sha }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy Coordinator (3.236.130.251 -> 10.0.1.16)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: COORDINATOR_IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$COORDINATOR_IMAGE"
            docker rm -f kv-coordinator || true
            docker run -d --name kv-coordinator --restart unless-stopped \
              -p 8080:8080 \
              -v coordinator-data:/app/data \
              -e DATA_DIR="/app/data" \
              -e VIRTUAL_NODES="150" \
              -e SHARD_TIMEOUT_SECONDS="10" \
              "$COORDINATOR_IMAGE"
            docker logout ghcr.io
            docker image prune -f
            for i in $(seq 1 25); do
              if curl -fsS http://localhost:8080/health > /dev/null; then echo "Coordinator healthy"; break; fi
              sleep 2
            done

      - name: Deploy Shard 1 (13.220.165.95 -> 10.0.1.70)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SHARD1_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SHARD_IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$SHARD_IMAGE"
            docker rm -f kv-shard-1 || true
            docker run -d --name kv-shard-1 --restart unless-stopped \
              -p 8080:8080 \
              -v shard1-data:/app/data \
              -e SHARD_ID="shard-1" \
              -e SELF_URL="http://10.0.1.70:8080" \
              -e COORDINATOR_URL="http://10.0.1.16:8080" \
              -e PERSISTENCE_PATH="/app/data/shard-1.json" \
              "$SHARD_IMAGE"
            docker logout ghcr.io
            docker image prune -f

      - name: Deploy Shard 2 (13.218.149.223 -> 10.0.1.47)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SHARD2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SHARD_IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$SHARD_IMAGE"
            docker rm -f kv-shard-2 || true
            docker run -d --name kv-shard-2 --restart unless-stopped \
              -p 8080:8080 \
              -v shard2-data:/app/data \
              -e SHARD_ID="shard-2" \
              -e SELF_URL="http://10.0.1.47:8080" \
              -e COORDINATOR_URL="http://10.0.1.16:8080" \
              -e PERSISTENCE_PATH="/app/data/shard-2.json" \
              "$SHARD_IMAGE"
            docker logout ghcr.io
            docker image prune -f

      - name: Verify Cluster Health & Registered Shards
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 5
            curl -fsS http://localhost:8080/api/shards
